<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pentatonic Circle Trainer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none;font-family:system-ui,sans-serif}
html,body{width:100vw;height:100dvh;overflow:hidden;background:#0f172a;color:#f8fafc}
body{display:flex;flex-direction:column;align-items:center;padding:6px 10px;gap:6px}
.bar{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:6px 12px;width:100%;max-width:1160px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
select,button{background:#0f172a;color:#f8fafc;border:1px solid #475569;padding:4px 8px;border-radius:5px;font-size:.75rem;cursor:pointer;touch-action:manipulation}
.tag{color:#38bdf8;font-size:.72rem;font-weight:700;background:#0f172a;border:1px solid #334155;padding:3px 8px;border-radius:5px;white-space:nowrap}
h1{font-size:1.15rem;white-space:nowrap}
.slots{display:flex;gap:6px}
.slot{width:46px;height:40px;border:1px dashed #475569;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;line-height:1.1}
.slot small{font-size:.6rem;color:#94a3b8;font-weight:500}
.slot.ok{border-style:solid;border-color:#22c55e;background:#14532d;color:#4ade80}
.slot.no{border-style:solid;border-color:#ef4444;background:#7f1d1d;color:#f87171}
.stage{flex:1;width:100%;min-height:0;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
.piano{position:relative;display:flex;gap:2px;background:#020617;padding:4px;border:1px solid #334155;border-radius:8px;flex-shrink:0}
.w{flex:1;height:100%;background:#e2e8f0;border-radius:0 0 4px 4px;cursor:pointer}
.w:active{background:#cbd5e1}
.b{position:absolute;top:4px;width:4.1%;height:63%;background:#020617;border-radius:0 0 4px 4px;z-index:2;cursor:pointer;transform:translateX(-50%)}
.b:active{background:#1e293b}
.ok{background:#22c55e!important}
.no{background:#ef4444!important}
</style>
</head>
<body>

<div class="bar">
  <h1 id="title"></h1>
  <div class="slots" id="slots"></div>
  <div id="stat" style="font-size:.82rem;font-weight:700;color:#38bdf8;white-space:nowrap">1/24 • 🔥0 • 100%</div>
</div>

<div class="stage" id="stage"><div class="piano" id="piano"></div></div>

<div class="bar">
  <div class="grp">
    <select id="mode"><option value="all">All 24</option><option value="maj">Major (12)</option><option value="min">Minor (12)</option></select>
    <select id="ord"><option value="4th" selected>4ths</option><option value="5th">5ths</option><option value="rnd">Shuffled</option></select>
    <select id="dir"><option value="asc">Ascending ↑</option><option value="desc">Descending ↓</option><option value="mix">Mixed ↕</option></select>
    <span class="tag" id="tag"></span>
  </div>
  <div class="grp">
    <button id="ansBtn">Reveal</button>
    <button id="skpBtn">Skip →</button>
  </div>
</div>

<script>
document.addEventListener("dblclick", e => e.preventDefault(), {passive: false});
document.addEventListener("gesturestart", e => e.preventDefault(), {passive: false});

const SHARPS = "C,C♯,D,D♯,E,F,F♯,G,G♯,A,A♯,B".split(","),
      FLATS  = "C,D♭,D,E♭,E,F,G♭,G,A♭,A,B♭,B".split(","),
      MAJ_I  = Uint8Array.of(0, 2, 4, 7, 9),
      MIN_I  = Uint8Array.of(0, 3, 5, 7, 10),
      MAJ_D  = "1,2,3,5,6".split(","),
      MIN_D  = "1,♭3,4,5,♭7".split(","),
      KEYS   = "AWSEDFTGYHUJK".split(""),
      NOTES  = Uint8Array.of(0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 1, 0),
      PIANO_RATIO = 14 / 6.38;

let deck = [], idx = 0, step = 0, lock = 0, streak = 0, tries = 0, hits = 0, clean = 1;

function fitPiano(){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if(!sw || !sh) return;
  let w = sw, h = w / PIANO_RATIO;
  if(h > sh){ h = sh; w = h * PIANO_RATIO; }
  piano.style.width = `${Math.floor(w)}px`;
  piano.style.height = `${Math.floor(h)}px`;
}
new ResizeObserver(fitPiano).observe(stage);

function makeDeck(){
  const m = mode.value, o = ord.value, d = dir.value;
  let steps = Array.from({length: 12}, (_, i) => i);
  if(o === "4th") steps = [0, ...steps.slice(1).reverse()];
  deck = [];

  function spellNote(pc, sVal){
    if(sVal === 6) return `${SHARPS[pc]}/${FLATS[pc]}`;
    return sVal >= 7 ? FLATS[pc] : SHARPS[pc];
  }

  const pushScale = (t, sig, sVal, rootPc, rootName, intervals, degrees) => {
    const desc = d === "desc" || (d === "mix" && Math.random() < 0.5);
    let pcs = Array.from(intervals, i => (rootPc + i) % 12);
    let deg = [...degrees];
    let names = Array.from(intervals, i => spellNote((rootPc + i) % 12, sVal));
    if(desc){
      pcs = [pcs[0], ...pcs.slice(1).reverse()];
      deg = [deg[0], ...deg.slice(1).reverse()];
      names = [names[0], ...names.slice(1).reverse()];
    }
    deck.push({t, sig, pc: rootPc, root: rootName, pcs, deg, names, desc});
  };

  steps.forEach(s => {
    const majPc = (s * 7) % 12, minPc = (majPc + 9) % 12;
    const sig = s === 0 ? "0 ♯/♭" : s === 6 ? "6♯/6♭" : s >= 7 ? `${12 - s}♭` : `${s}♯`;
    if(m !== "min") pushScale("Major", sig, s, majPc, spellNote(majPc, s), MAJ_I, MAJ_D);
    if(m !== "maj") pushScale("Minor", sig, s, minPc, spellNote(minPc, s), MIN_I, MIN_D);
  });

  if(o === "rnd") deck.sort(() => Math.random() - .5);
  idx = 0; load();
}

function load(){
  const q = deck[idx]; step = 0; lock = 0; clean = 1;
  tag.textContent = q.sig;
  title.textContent = `${q.root} ${q.t} ${q.desc ? "↓" : "↑"}`;
  clearKeys(); drawSlots(); drawStat();
}

function clearKeys(){
  document.querySelectorAll(".piano div").forEach(k => k.classList.remove("ok", "no"));
}

function drawSlots(){
  const q = deck[idx];
  slots.innerHTML = q.deg.map((d, i) => `<div class="slot ${i < step ? 'ok' : ''}"><small>${d}</small><span>${i < step ? q.names[i] : '—'}</span></div>`).join("");
}

function press(midi){
  if(lock) return;
  const q = deck[idx], pc = midi % 12, k = document.querySelector(`[data-m="${midi}"]`);

  if(pc === q.pcs[step]){
    k?.classList.add("ok");
    step++;
    drawSlots();
    if(step === 5){
      lock = 1; tries++;
      if(clean){ streak++; hits++; }
      drawStat();
      setTimeout(() => { idx = (idx + 1) % deck.length; load(); }, 450);
    }
  } else {
    lock = 1; clean = 0; streak = 0;
    k?.classList.add("no");
    if(slots.children[step]) slots.children[step].className = "slot no";
    drawStat();
    setTimeout(() => {
      step = 0; lock = 0;
      clearKeys(); drawSlots();
    }, 380);
  }
}

function reveal(){
  if(lock) return;
  lock = 1; tries++; streak = 0;
  const q = deck[idx], el = slots.children;
  clearKeys();
  let m = q.desc ? (72 + q.pcs[0]) : (60 + q.pcs[0]);
  if(m > 83) m -= 12;
  q.pcs.forEach((pc, i) => {
    if(q.desc){
      while(m % 12 !== pc) m--;
    } else {
      while(m % 12 !== pc) m++;
    }
    el[i].className = "slot ok"; el[i].lastChild.textContent = q.names[i];
    document.querySelector(`[data-m="${m}"]`)?.classList.add("ok");
  });
  drawStat();
}

function drawStat(){
  stat.textContent = `${idx + 1}/${deck.length} • 🔥${streak} • ${tries ? Math.round(hits / tries * 100) : 100}%`;
}

let wCount = 0, kbd = {};
for(let o = 0; o < 2; o++) NOTES.forEach((isB, pc) => {
  const m = 60 + o * 12 + pc, d = document.createElement("div"),
        kChar = o === 0 ? KEYS[pc] : (o === 1 && pc === 0 ? "K" : "");
  d.dataset.m = m; d.className = isB ? "b" : "w";
  if(isB) d.style.left = `calc(4px + (100% - 8px) * ${wCount / 14})`; else wCount++;
  d.onpointerdown = (e) => { e.preventDefault(); press(m); };
  piano.appendChild(d);
  if(kChar) kbd[kChar.toLowerCase()] = m;
});

mode.onchange = ord.onchange = dir.onchange = makeDeck;
ansBtn.onclick = reveal;
skpBtn.onclick = () => { idx = (idx + 1) % deck.length; load(); };
onkeydown = (e) => {
  if(e.repeat) return;
  const m = kbd[e.key.toLowerCase()];
  if(m !== undefined) press(m);
};

makeDeck();
fitPiano();
</script>
</body>
</html>
